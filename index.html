<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111f">
  <title>NFC Sound Station</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --panel: rgba(14, 29, 49, 0.78);
      --panel-strong: #10233a;
      --line: rgba(167, 207, 255, 0.16);
      --text: #f4f8ff;
      --muted: #91a6bd;
      --accent: #67e8f9;
      --accent-2: #818cf8;
      --success: #62e6a8;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      padding: 24px;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(103, 232, 249, 0.18), transparent 32%),
        radial-gradient(circle at 85% 90%, rgba(129, 140, 248, 0.2), transparent 35%),
        var(--bg);
    }

    body::before,
    body::after {
      position: fixed;
      z-index: -1;
      width: 280px;
      height: 280px;
      border: 1px solid rgba(103, 232, 249, 0.08);
      border-radius: 50%;
      content: "";
      animation: drift 14s ease-in-out infinite alternate;
    }

    body::before { top: -120px; right: 15%; }
    body::after { bottom: -150px; left: 12%; animation-delay: -5s; }

    .player-card {
      width: min(100%, 460px);
      padding: clamp(24px, 5vw, 38px);
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(145deg, rgba(24, 50, 78, 0.82), var(--panel));
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      animation: rise-in 0.7s ease-out both;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 28px;
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .eyebrow-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 5px rgba(98, 230, 168, 0.12), 0 0 18px var(--success);
    }

    .artwork {
      position: relative;
      display: grid;
      place-items: center;
      width: min(66vw, 238px);
      aspect-ratio: 1;
      margin: 0 auto 28px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 50%;
      background: linear-gradient(145deg, #233e68, #111d3c 70%);
      box-shadow: inset 0 0 35px rgba(103, 232, 249, 0.12), 0 15px 45px rgba(0, 0, 0, 0.26);
    }

    .artwork::before,
    .artwork::after {
      position: absolute;
      border: 1px solid rgba(103, 232, 249, 0.3);
      border-radius: 50%;
      content: "";
      animation: ring 2.8s ease-out infinite;
    }

    .artwork::before { inset: 15%; }
    .artwork::after { inset: 5%; animation-delay: 1.3s; }

    .speaker {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      width: 92px;
      height: 92px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 28px;
      color: var(--text);
      background: linear-gradient(145deg, var(--accent-2), #4f46e5);
      box-shadow: 0 14px 30px rgba(79, 70, 229, 0.4);
    }

    .speaker svg { width: 42px; height: 42px; }

    .visualizer {
      position: absolute;
      right: 17%;
      bottom: 14%;
      left: 17%;
      display: flex;
      align-items: end;
      justify-content: center;
      gap: 5px;
      height: 34px;
    }

    .bar {
      width: 5px;
      height: 9px;
      border-radius: 999px;
      background: var(--accent);
      opacity: 0.7;
      transition: height 0.2s ease;
    }

    .is-playing .bar { animation: equalize 0.9s ease-in-out infinite alternate; }
    .is-playing .bar:nth-child(2) { animation-delay: -0.25s; }
    .is-playing .bar:nth-child(3) { animation-delay: -0.6s; }
    .is-playing .bar:nth-child(4) { animation-delay: -0.1s; }
    .is-playing .bar:nth-child(5) { animation-delay: -0.45s; }
    .is-playing .bar:nth-child(6) { animation-delay: -0.7s; }
    .is-playing .bar:nth-child(7) { animation-delay: -0.35s; }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 5vw, 2.2rem);
      letter-spacing: -0.04em;
      text-align: center;
    }

    .subtitle {
      max-width: 310px;
      margin: 10px auto 26px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.6;
      text-align: center;
    }

    .timeline { margin: 0 0 24px; }

    input[type="range"] {
      width: 100%;
      height: 5px;
      margin: 0;
      appearance: none;
      border-radius: 999px;
      outline: none;
      background: linear-gradient(90deg, var(--accent) 0%, rgba(255,255,255,0.13) 0%);
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      width: 15px;
      height: 15px;
      appearance: none;
      border: 3px solid #0d1b2e;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(103, 232, 249, 0.16);
    }

    input[type="range"]::-moz-range-thumb {
      width: 11px;
      height: 11px;
      border: 3px solid #0d1b2e;
      border-radius: 50%;
      background: var(--accent);
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      margin-top: 9px;
      color: var(--muted);
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 25px;
    }

    button {
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--line);
      color: var(--text);
      background: rgba(255, 255, 255, 0.07);
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    }

    button:hover { border-color: rgba(103, 232, 249, 0.55); background: rgba(103, 232, 249, 0.12); transform: translateY(-2px); }
    button:active { transform: translateY(0) scale(0.96); }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(103, 232, 249, 0.55); outline-offset: 3px; }

    .icon-btn { width: 44px; height: 44px; border-radius: 50%; }
    .icon-btn svg { width: 19px; height: 19px; }

    .play-btn {
      width: 68px;
      height: 68px;
      border: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #5b7cfa);
      box-shadow: 0 10px 25px rgba(103, 232, 249, 0.26);
    }

    .play-btn:hover { background: linear-gradient(135deg, #a5f3fc, #818cf8); }
    .play-btn svg { width: 26px; height: 26px; color: #07111f; }

    .bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .status {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 9px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .status strong { overflow: hidden; color: var(--text); font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .status-indicator { width: 7px; height: 7px; flex: 0 0 auto; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
    .is-playing .status-indicator { background: var(--success); box-shadow: 0 0 12px var(--success); }

    .volume { display: flex; align-items: center; gap: 8px; width: 130px; }
    .volume svg { width: 17px; height: 17px; flex: 0 0 auto; color: var(--muted); }
    .volume input { height: 4px; }

    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    @keyframes rise-in { from { opacity: 0; transform: translateY(18px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes drift { to { transform: translate(30px, 20px) scale(1.08); } }
    @keyframes ring { 0%, 100% { opacity: 0.3; transform: scale(0.96); } 50% { opacity: 0.7; transform: scale(1.03); } }
    @keyframes equalize { from { height: 7px; } to { height: 31px; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }

    @media (max-width: 420px) {
      body { padding: 14px; }
      .player-card { border-radius: 24px; }
      .bottom-row { align-items: flex-start; flex-direction: column; }
      .volume { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="player-card" id="playerCard">
    <div class="eyebrow"><span class="eyebrow-dot" aria-hidden="true"></span> NFC Sound Station</div>

    <div class="artwork" aria-hidden="true">
      <div class="speaker">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 5 6.8 9H4a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1h2.8L11 19V5Z" />
          <path d="M15.5 9.5a4 4 0 0 1 0 5M18 7a7.5 7.5 0 0 1 0 10" />
        </svg>
      </div>
      <div class="visualizer" aria-hidden="true">
        <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
        <span class="bar"></span><span class="bar"></span><span class="bar"></span>
      </div>
    </div>

    <h1>NFC Sound Station</h1>
    <p class="subtitle" id="subtitle">Tap play to start your audio experience.</p>

    <audio id="player" src="mixkit-cartoon-laugh-voice-2882.wav" preload="auto" playsinline></audio>

    <div class="timeline">
      <label class="sr-only" for="progress">Audio progress</label>
      <input id="progress" type="range" min="0" max="100" value="0" step="0.1" aria-label="Audio progress">
      <div class="time-row"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
    </div>

    <div class="controls">
      <button class="icon-btn" id="restartBtn" type="button" aria-label="Restart audio" title="Restart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
      <button class="play-btn" id="playBtn" type="button" aria-label="Play audio" title="Play">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6a1 1 0 0 0 1.53.85l10-6.8a1 1 0 0 0 0-1.7l-10-6.8A1 1 0 0 0 8 5.2Z"/></svg>
      </button>
      <button class="icon-btn" id="muteBtn" type="button" aria-label="Mute audio" title="Mute">
        <svg id="volumeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.8 9H4a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1h2.8L11 19V5Z"/><path d="M15.5 9.5a4 4 0 0 1 0 5"/></svg>
      </button>
    </div>

    <div class="bottom-row">
      <div class="status" role="status" aria-live="polite"><span class="status-indicator" aria-hidden="true"></span><strong id="statusMsg">Ready to play</strong></div>
      <div class="volume">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6.8 9H4a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1h2.8L11 19V5Z"/><path d="M15.5 9.5a4 4 0 0 1 0 5"/></svg>
        <label class="sr-only" for="volume">Volume</label>
        <input id="volume" type="range" min="0" max="1" value="0.85" step="0.01" aria-label="Volume">
      </div>
    </div>
  </main>

  <script>
    const player = document.getElementById('player');
    const card = document.getElementById('playerCard');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const restartBtn = document.getElementById('restartBtn');
    const muteBtn = document.getElementById('muteBtn');
    const volumeIcon = document.getElementById('volumeIcon');
    const progress = document.getElementById('progress');
    const volume = document.getElementById('volume');
    const statusMsg = document.getElementById('statusMsg');
    const subtitle = document.getElementById('subtitle');
    const currentTime = document.getElementById('currentTime');
    const duration = document.getElementById('duration');

    const icons = {
      play: '<path d="M8 5.2v13.6a1 1 0 0 0 1.53.85l10-6.8a1 1 0 0 0 0-1.7l-10-6.8A1 1 0 0 0 8 5.2Z"/>',
      pause: '<rect x="7" y="5" width="3.5" height="14" rx="1"/><rect x="13.5" y="5" width="3.5" height="14" rx="1"/>',
      volume: '<path d="M11 5 6.8 9H4a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1h2.8L11 19V5Z"/><path d="M15.5 9.5a4 4 0 0 1 0 5"/>',
      muted: '<path d="M11 5 6.8 9H4a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1h2.8L11 19V5Z"/><path d="m16 9 5 6m0-6-5 6"/>'
    };

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return '0:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60).toString().padStart(2, '0');
      return `${mins}:${secs}`;
    }

    function paintRange(input, percent) {
      const safePercent = Math.max(0, Math.min(100, percent));
      input.style.background = `linear-gradient(90deg, var(--accent) ${safePercent}%, rgba(255,255,255,0.13) ${safePercent}%)`;
    }

    function setPlaying(isPlaying) {
      card.classList.toggle('is-playing', isPlaying);
      playBtn.setAttribute('aria-label', isPlaying ? 'Pause audio' : 'Play audio');
      playBtn.title = isPlaying ? 'Pause' : 'Play';
      playIcon.innerHTML = isPlaying ? icons.pause : icons.play;
      statusMsg.textContent = isPlaying ? 'Playing now' : 'Ready to play';
      subtitle.textContent = isPlaying ? 'Audio is streaming from your NFC station.' : 'Tap play to start your audio experience.';
    }

    async function togglePlay() {
      if (player.paused) {
        try {
          await player.play();
        } catch {
          statusMsg.textContent = 'Tap play to begin audio';
          subtitle.textContent = 'Your browser needs a tap before playback can start.';
        }
      } else {
        player.pause();
      }
    }

    playBtn.addEventListener('click', togglePlay);

    restartBtn.addEventListener('click', () => {
      player.currentTime = 0;
      player.play().catch(() => {});
    });

    muteBtn.addEventListener('click', () => {
      player.muted = !player.muted;
      muteBtn.setAttribute('aria-label', player.muted ? 'Unmute audio' : 'Mute audio');
      muteBtn.title = player.muted ? 'Unmute' : 'Mute';
      volumeIcon.innerHTML = player.muted ? icons.muted : icons.volume;
    });

    player.addEventListener('loadedmetadata', () => {
      duration.textContent = formatTime(player.duration);
    });

    player.addEventListener('timeupdate', () => {
      const percent = player.duration ? (player.currentTime / player.duration) * 100 : 0;
      progress.value = percent;
      paintRange(progress, percent);
      currentTime.textContent = formatTime(player.currentTime);
    });

    progress.addEventListener('input', () => {
      if (player.duration) player.currentTime = (Number(progress.value) / 100) * player.duration;
      paintRange(progress, Number(progress.value));
    });

    volume.addEventListener('input', () => {
      player.volume = Number(volume.value);
      player.muted = player.volume === 0;
      volumeIcon.innerHTML = player.muted ? icons.muted : icons.volume;
      paintRange(volume, Number(volume.value) * 100);
    });

    player.addEventListener('play', () => setPlaying(true));
    player.addEventListener('pause', () => setPlaying(false));
    player.addEventListener('ended', () => {
      setPlaying(false);
      statusMsg.textContent = 'Finished — tap play to replay';
      subtitle.textContent = 'Your audio is ready whenever you are.';
    });
    player.addEventListener('error', () => {
      statusMsg.textContent = 'Audio could not be loaded';
      subtitle.textContent = 'Check that the audio file is available and try again.';
    });

    player.volume = Number(volume.value);
    paintRange(volume, Number(volume.value) * 100);

    // Attempt autoplay, while keeping the prominent controls for browser policies.
    window.addEventListener('load', () => player.play().catch(() => {
      statusMsg.textContent = 'Ready — tap play to listen';
    }), { once: true });

    document.addEventListener('keydown', (event) => {
      if (event.code === 'Space' && event.target === document.body) {
        event.preventDefault();
        togglePlay();
      }
    });
  </script>
</body>
</html>
